<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml"><title>Negative stdDeviation values are treated as zero</title><h:link href="https://drafts.csswg.org/filter-effects-1/#feGaussianBlurElement" rel="help"/><h:link href="https://drafts.csswg.org/filter-effects-1/#element-attrdef-fegaussianblur-stddeviation" rel="help"/><h:link href="reference/feGaussianBlur-negative-deviation-ref.svg" rel="match"/><defs><filter id="f1"><feGaussianBlur stdDeviation="-1"/></filter><filter id="f2"><feGaussianBlur stdDeviation="-1 -1"/></filter><filter id="f3"><feGaussianBlur stdDeviation="1 -1"/></filter><filter id="f4"><feGaussianBlur stdDeviation="-1 1"/></filter></defs><rect width="10" height="10" x="50" y="20" fill="green" filter="url(#f1)"/><rect width="10" height="10" x="50" y="40" fill="green" filter="url(#f2)"/><rect width="10" height="10" x="50" y="60" fill="green" filter="url(#f3)"/><rect width="10" height="10" x="50" y="80" fill="green" filter="url(#f4)"/></svg>