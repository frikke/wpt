<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" width="200" height="200"><title>A marker with a zero viewBox is not rendered</title><h:link href="https://w3c.github.io/svgwg/svg2-draft/coords.html#ViewBoxAttribute" rel="help"/><h:link href="viewBox-zero-disables-rendering-marker-ref.svg" rel="match"/><h:meta content="A marker whose viewBox has a zero width disables rendering; only the path stroke is painted, not the marker." name="assert"/><defs><marker id="m" markerHeight="100" markerUnits="userSpaceOnUse" markerWidth="100" refX="0" refY="0" viewBox="0 0 0 100"><rect width="100" height="100" fill="green"/></marker></defs><path fill="none" stroke="#000" stroke-width="1" marker-start="url(#m)" d="M20,20 L180,20"/></svg>