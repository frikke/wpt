<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" width="800" height="800"><title>SVG Geometry Properties: parsing the y presentation attribute with invalid values</title><metadata><h:link href="https://w3c.github.io/svgwg/svg2-draft/geometry.html#Y" rel="help"/><h:link href="https://w3c.github.io/svgwg/svg2-draft/types.html#presentation-attribute-css-value" rel="help"/><h:link href="https://github.com/web-platform-tests/wpt/issues/61017" rel="help"/><h:meta content="the y presentation attribute rejects values outside '&lt;length-percentage&gt; | &lt;number&gt;' and keeps the initial computed value." name="assert"/></metadata><rect id="target"/><h:script src="/resources/testharness.js"/><h:script src="/resources/testharnessreport.js"/><h:script src="support/attribute-testcommon.js"/><script><![CDATA[

