<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" width="800" height="800"><title>SVG Geometry Properties: parsing the ry presentation attribute on ellipse with valid values</title><metadata><h:link href="https://w3c.github.io/svgwg/svg2-draft/geometry.html#RY" rel="help"/><h:link href="https://w3c.github.io/svgwg/svg2-draft/types.html#presentation-attribute-css-value" rel="help"/><h:link href="https://github.com/web-platform-tests/wpt/issues/61017" rel="help"/><h:meta content="the ry presentation attribute on ellipse supports '&lt;length-percentage [0,inf]&gt; | &lt;number [0,inf]&gt; | auto'." name="assert"/></metadata><ellipse id="target"/><h:script src="/resources/testharness.js"/><h:script src="/resources/testharnessreport.js"/><h:script src="support/attribute-testcommon.js"/><script><![CDATA[

